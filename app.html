<title>DreamHub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — sticky top bar, scrolling view, fixed tab bar. Journey metaphor: night sky (where you are) → dawn (where you're going). */
:root {
  --bg: #f2f4fa;
  --surface: #ffffff;
  --surface-2: #e8ecf6;
  --ink: #161a33;
  --muted: #5b6283;
  --line: #d5daea;
  --accent: #c76a00;          /* dawn amber */
  --accent-ink: #ffffff;
  --accent-soft: #fbe9d2;
  --coral: #d9473a;
  --good: #1f8a5b;
  --good-soft: #dcf2e7;
  --sky-1: #1b2150;
  --sky-2: #3a3f8f;
  --display: "Unbounded", "Montserrat", system-ui, sans-serif;
  --body: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 16px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1226; --surface: #181c38; --surface-2: #222749; --ink: #eef0fb; --muted: #a2a8cc;
    --line: #2e3460; --accent: #ffb547; --accent-ink: #1b1400; --accent-soft: #3a2f1c; --coral: #ff7a6b;
    --good: #4fd19a; --good-soft: #17352b; --sky-1: #0b0e22; --sky-2: #2a2f72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1226; --surface: #181c38; --surface-2: #222749; --ink: #eef0fb; --muted: #a2a8cc;
  --line: #2e3460; --accent: #ffb547; --accent-ink: #1b1400; --accent-soft: #3a2f1c; --coral: #ff7a6b;
  --good: #4fd19a; --good-soft: #17352b; --sky-1: #0b0e22; --sky-2: #2a2f72; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sky-1); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: inherit; }

.app { max-width: 520px; margin: 0 auto; min-height: 100%; padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 16px); }

/* top bar: the night sky */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: linear-gradient(180deg, var(--sky-1), var(--sky-2));
  color: #fff;
  padding-block: 12px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center;
}
.brand { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .01em; }
.brand small { display: block; font-family: var(--body); font-weight: 500; font-size: 12px; opacity: .78; letter-spacing: 0; }
.langs { display: flex; gap: 2px; background: rgba(255,255,255,.12); border-radius: 999px; padding: 3px; }
.langs button { border: 0; background: transparent; color: #fff; font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 999px; opacity: .75; }
.langs button[aria-pressed="true"] { background: #fff; color: #161a33; opacity: 1; }
.stats { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.13); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip b { color: #ffcf7a; }

/* view */
.view {
  padding-block: 18px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
h1 { font-family: var(--display); font-size: 22px; line-height: 1.2; margin: 0; text-wrap: balance; font-weight: 700; }
h2 { font-family: var(--display); font-size: 16px; margin: 0; font-weight: 500; }
.lead { color: var(--muted); margin: 6px 0 0; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; font-weight: 700; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; min-height: 44px;
}
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.full { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; font-size: 13px; align-self: flex-start; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.input, select.input, textarea.input {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; min-height: 46px;
}
textarea.input { min-height: 88px; resize: vertical; }
.code-input { font-family: var(--display); font-size: 20px; letter-spacing: .14em; text-transform: uppercase; text-align: center; }
.err { color: var(--coral); font-size: 13px; margin: 0; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.demo-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--accent-soft); color: var(--accent); padding: 3px 8px; border-radius: 6px; }

/* unblur moments */
.moment { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.moment .content { padding: 18px; display: flex; flex-direction: column; gap: 10px; transition: filter 1.1s ease, transform 1.1s ease; }
.moment.blurred .content { filter: blur(9px) saturate(1.2); transform: scale(1.03); user-select: none; }
.moment .veil {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; gap: 6px; padding: 16px;
  background: linear-gradient(180deg, rgba(15,18,38,.15), rgba(15,18,38,.45)); color: #fff; font-weight: 700;
  transition: opacity .6s ease;
}
.moment:not(.blurred) .veil { opacity: 0; pointer-events: none; }
.moment .veil span { background: rgba(15,18,38,.65); padding: 8px 14px; border-radius: 999px; font-size: 13px; }
.moment.revealing .content::after {
  content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,207,122,.45) 50%, transparent 70%);
  animation: sweep 1.1s ease forwards; pointer-events: none;
}
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.m-title { font-family: var(--display); font-size: 17px; font-weight: 700; margin: 0; }
.m-from { font-size: 12.5px; color: var(--muted); }
.cover { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.cover li { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--good-soft); font-weight: 600; }
.cover li::before { content: "✓"; color: var(--good); font-weight: 800; }
.letter { background: var(--bg); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; font-size: 13.5px; display: flex; flex-direction: column; gap: 8px; }
.letter .lh { font-family: Georgia, "Times New Roman", serif; font-size: 17px; font-weight: 700; }
.redact { display: inline-block; background: var(--ink); border-radius: 3px; height: .9em; vertical-align: middle; }
.quote { font-size: 15px; font-weight: 600; border-left: 3px solid var(--accent); padding-left: 12px; margin: 0; }
.stamp { position: absolute; top: 12px; right: 12px; transform: rotate(8deg); border: 2px solid var(--coral); color: var(--coral); font-weight: 800; font-size: 11px; letter-spacing: .1em; padding: 2px 6px; border-radius: 6px; z-index: 1; }
.archive { display: grid; gap: 10px; }
.arch-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; }
.arch-item .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); flex: none; font-size: 18px; }
.arch-item .tx { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.arch-item .tx b { font-size: 14px; }
.arch-item .tx small { color: var(--muted); font-size: 12px; }
.arch-item.open .ic { background: var(--accent-soft); }

/* quiz */
.progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--coral)); border-radius: inherit; transition: width .4s ease; }
.options { display: grid; gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 13px 14px; text-align: left; font-weight: 600; min-height: 48px; }
.opt:hover { border-color: var(--accent); }

/* mirror result */
.hero-head { display: flex; gap: 12px; align-items: center; }
.avatar { width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 20px; color: #fff; background: linear-gradient(135deg, var(--sky-2), var(--coral)); }
.avatar.sm { width: 26px; height: 26px; font-size: 12px; }
.kv { display: grid; gap: 8px; margin: 0; }
.kv div { display: grid; gap: 2px; }
.kv dt { font-size: 12px; color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; }
.similar { background: var(--accent-soft); border-radius: 12px; padding: 12px; font-size: 14px; }

/* map */
.map-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.road { position: relative; display: flex; flex-direction: column; gap: 14px; padding-left: 34px; }
.road::before { content: ""; position: absolute; left: 14px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px;
  background: repeating-linear-gradient(180deg, var(--line) 0 8px, transparent 8px 14px); }
.node { position: relative; }
.node .dot { position: absolute; left: -34px; top: 12px; width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface); border: 2px solid var(--line); font-size: 13px; font-weight: 800; color: var(--muted); z-index: 1; }
.node.done .dot { background: var(--good); border-color: var(--good); color: #fff; }
.node.current .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 6px var(--accent-soft); }
.node.locked .card { opacity: .62; }
.node.goal .card { background: linear-gradient(135deg, var(--sky-1), var(--sky-2)); color: #fff; border: 0; }
.node.goal .dot { background: #ffcf7a; border-color: #ffcf7a; color: #161a33; }
.node.start .card { background: var(--surface-2); }
.node .card { padding: 12px 14px; gap: 8px; }
.node h3 { margin: 0; font-size: 15px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.goal .hint, .goal .eyebrow { color: rgba(255,255,255,.75); }
.hero-note { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.hero-note p { margin: 0; min-width: 0; }
.quest { border: 2px solid var(--accent); }
.quest .task { font-weight: 600; margin: 0; }
.status-done { color: var(--good); font-weight: 700; font-size: 13px; }

/* league */
.goalbar { display: grid; gap: 6px; }
.goalbar .progress { height: 10px; }
.board { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.board li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.board li.me { border-color: var(--accent); background: var(--accent-soft); }
.board .rank { font-weight: 800; color: var(--muted); text-align: center; }
.board .name { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.board .pts { font-weight: 700; }
.board .bar { grid-column: 2 / -1; height: 4px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.board .bar i { display: block; height: 100%; background: var(--accent); }

/* tabbar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar nav { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar-h); }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--accent); }

.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; opacity: 0;
  transition: opacity .25s, transform .25s; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.foot { text-align: center; font-size: 11.5px; color: var(--muted); padding-inline: 16px; margin: 8px 0 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

<div class="app">

  </nav>
</div>

/* ============================ matching (as in the bot) ============================ */
const FIELDS = ["role", "goal", "country", "level", "fear", "time"];
const W = { goal: 3, fear: 3, country: 2, role: 1, level: 1, time: 1 };
function compare(p, s) {
  let score = 0; const same = [], diff = [];
  for (const f of FIELDS) {
    const mine = p[f];
    if (!mine || (f === "country" && mine === "any") || (f === "level" && mine === "unknown")) continue;
    if (s[f] === mine) { score += W[f]; same.push(f); } else diff.push(f);
  }
  return { score, same, diff, s };
}
function bestMatch(p) {
  const rows = STORIES.map(s => compare(p, s));
  rows.sort((a, b) => (b.score - a.score) || ((b.same.includes("goal") && b.same.includes("fear")) - (a.same.includes("goal") && a.same.includes("fear"))));
  const r = rows[0];
  if (!r) return null;
  const level = r.same.includes("goal") && r.same.includes("fear") ? "strong" : (r.score >= 3 ? "partial" : "none");
  if (level === "none") return { level, id: null, same: [], diff: [] };
  return { level, id: r.s.id, same: r.same, diff: r.diff };
}
function explain(m) {
  const show = ["goal", "fear", "country", "role"];
  const parts = show.filter(f => m.same.includes(f)).map(f => `${t("f_" + f)} — ${opt(f, S.profile[f])}`);
  if (!parts.length) return "";
  let txt = t("same_head") + parts.join("; ") + ".";
  const d = show.filter(f => m.diff.includes(f)).map(f => t("f_" + f));
  if (d.length) txt += t("diff_head") + d.join(", ") + ".";
  return txt;
}

/* ============================ map steps ============================ */
const STEPS = ["goal", "mirror", "reqs", "mock", "practice", "book", "exam", "back"];
function stepDone(id) {
  if (id === "goal") return !!(S.setup && S.setup.dream);
  if (id === "mirror") return !!S.mirror;
  if (id === "practice") return S.practiceDays >= 7;
  return !!S.steps[id];
}
const doneCount = () => STEPS.filter(stepDone).length;
const currentStep = () => STEPS.find(id => !stepDone(id)) || null;
function checkUnlocks() {
  const n = doneCount();
  for (const m of MOMENTS) {
    if (!S.unlocked.includes(m.code) && n >= m.level) { S.unlocked.push(m.code); toast(t("t_unlock")); }
  }
}
function completeStep(id) {
  if (stepDone(id)) return;
  S.steps[id] = true; addPoints(20); haptic("success");
  setTimeout(() => toast(t("t_step")), 900);
  checkUnlocks();
}

function stepCard(id, idx, state) {

  if (s && id === "practice") heroNote = loc(s.prep);

  if (state === "current") {
    if (id === "goal") action = `<button class="btn" type="button" data-act="openSetup">${esc(t("btn_setup"))}</button>`;

  return `

}

function viewLeague() {
  const reg = S.setup && S.setup.region;
  if (!reg) return `<section><h1>${esc(t("league_title"))}</h1><p class="lead">${esc(t("pick_region"))}</p></section>${setupForm()}`;

  const rows = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const max = rows[0][1];
  const wDone = Math.min(DEMO_WEEK.goal, DEMO_WEEK.done + S.regionQuests);
  const pct = wDone / DEMO_WEEK.goal * 100;
  const invite = shareLink(appLink("ref_" + userId()), t("share_invite"));
  return `
  <section><h1>${esc(t("league_title"))}</h1><p class="lead">${esc(t("league_lead"))}</p></section>
  <section class="card">
    <span class="eyebrow">${esc(t("your_region"))}: ${esc(tri(REGIONS[reg]))}</span>
    <div class="goalbar"><b>${esc(t("week_goal", { done: wDone, goal: DEMO_WEEK.goal }))}</b>
      <div class="progress"><i style="width:${pct}%"></i></div></div>
    <p class="hint">${esc(wDone >= DEMO_WEEK.goal ? t("week_done") : t("week_unlock"))}</p>

}

function unblur(code) {
  const m = MOMENTS.find(x => x.code === code);
  if (!m) { const e = $("#codeErr"); if (e) e.hidden = false; haptic("error"); return; }
  const fresh = !S.unlocked.includes(code);
  if (fresh) { S.unlocked.push(code); }
  S.openMoment = code; S.pendingCode = "";
  render();
  const el = $("#moment-" + code);
  if (el && fresh) {
    el.classList.add("blurred");
    requestAnimationFrame(() => requestAnimationFrame(() => { el.classList.add("revealing"); el.classList.remove("blurred"); }));
    haptic("success");
    setTimeout(() => { addPoints(5); render(); }, 1200);
  }
  if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
}

document.addEventListener("click", e => {
  const lb = e.target.closest("#langs button"); if (lb) { S.lang = lb.dataset.lang; render(); return; }
  const tb = e.target.closest("#tabs button"); if (tb) { go(tb.dataset.tab); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "goMirror") go("mirror");
  else if (act === "goMap") go("map");
  else if (act === "viewMoment") {
    const code = a.dataset.code;
    if (S.unlocked.includes(code)) { S.openMoment = code; render(); const el = $("#moment-" + code); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); }
    else { const inp = $("#code"); if (inp) { inp.focus(); } }
  }
  else if (act === "startQuiz") { S.quizStep = 0; S.profile = {}; render(); }
  else if (act === "answer") {
    S.profile[a.dataset.f] = a.dataset.c; S.quizStep++;
    if (S.quizStep >= QUIZ.length) {
      S.quizStep = -1; S.mirror = bestMatch(S.profile);
      if (!S.mirrorRewarded) { S.mirrorRewarded = true; addPoints(20); }
      checkUnlocks();
    }
    render(); window.scrollTo(0, 0);
  }
  else if (act === "retake") { S.mirror = null; S.quizStep = 0; S.profile = {}; render(); }
  else if (act === "openSetup") { S.showSetup = true; render(); }
  else if (act === "done") { completeStep(a.dataset.step); render(); }
  else if (act === "openExam") link(CONFIG.examUrl);
  else if (act === "parents") {
    const cur = currentStep();
    const area = T[L()].areas[S.profile.fear || "start"];
    const next = cur ? t("s_" + cur, { area }) : t("done");
    link(shareLink(appLink(""), t("share_parents", { dream: S.setup && S.setup.dream || t("my_dream"), n: doneCount(), total: STEPS.length, next })));
  }
  else if (act === "story") link(`https://t.me/${CONFIG.botUsername}?start=become`);
  else if (act === "invite") { if (tg) { e.preventDefault(); link(a.href); } }
  else if (act === "nextDay") { S.dayOffset++; render(); }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "codeForm") unblur(String(f.code.value || "").trim().toUpperCase());
  else if (f.id === "setupForm") {
    const region = f.region.value, dream = f.dream.value.trim();
    if (!region || !dream) return;
    const wasDone = stepDone("goal");
    S.setup = { region, dream }; S.showSetup = false;
    if (!wasDone && !S.goalRewarded) { S.goalRewarded = true; addPoints(20); }
    checkUnlocks();
    render();
  }
  else if (f.id === "questForm") {
    const ans = f.answer.value.trim(); if (!ans) return;
    const d = today();
    const y = new Date(Date.now() + (S.dayOffset - 1) * 864e5).toISOString().slice(0, 10);
    S.streak = S.lastQuestDay === y ? S.streak + 1 : 1;
    S.lastQuestDay = d; S.questCount++; S.regionQuests++;
    if (S.practiceDays < 7) S.practiceDays++;
    addPoints(10); haptic("success"); checkUnlocks();
    render();
  }
});

/* ============================ start ============================ */
async function init() {
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.setHeaderColor && tg.setHeaderColor(getComputedStyle(document.documentElement).getPropertyValue("--sky-1").trim() || "#1b2150"); } catch (e) {}
    try { if (tg.colorScheme) document.documentElement.setAttribute("data-theme", tg.colorScheme); } catch (e) {}
  }
  const saved = await store.load();
  if (saved) S = Object.assign({}, DEFAULT, saved);
  if (!S.lang) {
    const lc = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code || navigator.language || "ru";
    S.lang = lc.startsWith("kk") ? "kk" : lc.startsWith("en") ? "en" : "ru";
  }
  try { const r = await fetch(CONFIG.storiesUrl); STORIES = (await r.json()).stories || []; } catch (e) { STORIES = []; }
  // код из ссылки: t.me/<бот>/<app>?startapp=GRANT  или  ?code=GRANT
  let param = "";
  try { param = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get("tgWebAppStartParam") || new URLSearchParams(location.search).get("code") || ""; } catch (e) {}
  param = String(param).toUpperCase();
  render();
  if (param && MOMENTS.some(m => m.code === param)) { S.tab = "unblur"; render(); setTimeout(() => unblur(param), 450); }
}
init();
})();
</script>
